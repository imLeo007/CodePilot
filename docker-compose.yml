services:
  codepilot:
    build: .
    container_name: codepilot_api
    ports:
      - "${PORT}:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - sample_app
  
  db:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - codepilot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready -U ${POSTGRES_USER} -d {POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  sample_app:
    build: ./projects/calculator
    container_name: calculator_sandbox
    volumes:
      - ./projects/calculator:/app
  
  wallet:
    build: ./projects/wallet
    container_name: wallet_sandbox
    volumes:
      - ./projects/wallet:/app

volumes:
  codepilot_data: